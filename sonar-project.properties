# Análise do SonarQube Cloud (ADR 0013). O workflow sonar.yml gera a cobertura
# e passa o que depende do runner: as pastas de bytecode do Java, as bibliotecas
# do cache do Gradle e os relatórios de cobertura do Go.
sonar.organization=mateusmacedo
sonar.projectKey=mateusmacedo_playground
sonar.projectName=playground
sonar.sourceEncoding=UTF-8
# WHY: sem a versão, o Sonar supõe Java 8 e deixa de aplicar as regras do Java
# 21 do build.
sonar.java.source=21

sonar.sources=apps,infra,tools
sonar.tests=apps,tools
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.spec.mjs,**/*_test.go,**/src/test/**,apps/backoffice-e2e/**
# WHY: os templates do gerador (files/) só viram código válido depois da
# geração; os assets de IA em .github/skills, .github/agents e .github/prompts
# são gerados pelo `nx configure-ai-agents` e não são editados aqui
# (.agents/README.md); as demais pastas são saída de build, de teste ou de
# ferramenta.
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.spec.mjs,**/*_test.go,**/src/test/**,apps/backoffice-e2e/**,tools/serverless/src/generators/*/files/**,.github/skills/**,.github/agents/**,.github/prompts/**,**/node_modules/**,**/.next/**,**/test-output/**,**/dist/**,**/build/**,**/.serverless/**,**/.terraform/**,**/.gradle/**

sonar.javascript.lcov.reportPaths=apps/**/test-output/vitest/coverage/lcov.info,tools/**/test-output/vitest/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=apps/**/build/reports/jacoco/test/jacocoTestReport.xml
sonar.coverage.exclusions=**/*.config.ts,**/*.config.mts,**/*.config.mjs,**/*.config.js,**/test-setup.ts,infra/**
