name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # NOTE: sem `version`, o pnpm/action-setup usa o `packageManager` do package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      # NOTE: define NX_BASE e NX_HEAD para os comandos affected e o format:check.
      - uses: nrwl/nx-set-shas@v5

      - run: pnpm exec nx sync:check
      - run: pnpm exec nx format:check --base="$NX_BASE" --head="$NX_HEAD"
      - run: pnpm exec nx affected -t lint test typecheck build

      # WHY: o Playwright gerado também lista Edge e Chrome de canal, que não vêm no runner; o CI cobre o Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec nx e2e backoffice-e2e -- --project=chromium
