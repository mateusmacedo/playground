name: Release

# NOTE: valida tudo (cobertura e e2e em todos os browsers) e publica pelo
# `nx release`; o ciclo completo está em docs/guides/release.md.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Simula o release (nada é commitado, tagueado, publicado nem criado no GitHub)'
        required: false
        default: false
        type: boolean
      version:
        description: 'Versão explícita (ex.: 1.0.0-rc.1) ou especificador do Nx (patch, minor, major, prerelease). Vazio calcula pelos commits'
        required: false
        default: ''
        type: string

# WHY: um release por vez e nunca cancelado no meio: cancelar entre o push das
# tags e a publicação deixa o repositório com tag sem pacote.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=3072
  NX_DAEMON: 'false'

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          go-version-file: apps/services/example-go/go.mod

      - name: Biome (completo)
        run: pnpm exec biome ci .

      # WHY: o Biome não formata Go; o script falha se o gofmt listar algum
      # arquivo e é o mesmo do ci.yml e do lint dos serviços Go.
      - name: gofmt
        run: bash tools/go-fmt-check.sh

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # WHY: o valor entra no hash do Nx (targetDefaults.test.inputs), então o
    # teste com coverage não reaproveita o cache do PR, que roda sem coverage.
    env:
      VITEST_COVERAGE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          go-version-file: apps/services/example-go/go.mod
          java-version: '21'
          terraform: 'true'

      - name: Verificar sync
        run: pnpm exec nx sync:check

      # NOTE: o `spotlessCheck` (20 a 50 s) só roda aqui; no PR, só o core Java
      # passa pelo `check`. O Nx pula os projetos sem `fmt` e `validate`.
      - name: Lint, typecheck, test, build, fmt, validate e spotless de todos os projetos
        run: pnpm exec nx run-many -t lint typecheck test build fmt validate spotlessCheck --parallel=3

  e2e:
    name: E2E (todos os browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_ALL_BROWSERS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          java-version: '21'

      # WHY: Edge e Chrome de canal não vêm no runner e não estão nos projetos.
      - name: Instalar browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # WHY: o painel do e2e lê e grava na API, servida pelo mock; o `up` só
      # volta com o container saudável (docs/guides/backoffice-api.md).
      - name: Subir o mock da API
        id: mock
        run: pnpm exec nx run backoffice-mock:up

      - name: E2E
        run: pnpm exec nx run-many -t e2e

      # NOTE: o target `logs` do mock segue o log e não termina; aqui vai o
      # compose direto, com o que o container registrou até a falha. Os dois
      # passos abaixo só rodam se a subida do mock chegou a ser tentada.
      - name: Log do mock da API
        if: ${{ failure() && (steps.mock.outcome == 'success' || steps.mock.outcome == 'failure') }}
        working-directory: apps/backoffice-mock
        run: docker compose logs --no-color --tail=500

      - name: Derrubar o mock da API
        if: ${{ always() && (steps.mock.outcome == 'success' || steps.mock.outcome == 'failure') }}
        run: pnpm exec nx run backoffice-mock:down

  # WHY: nenhuma versão sai sem as metas do ADR 0015, analisadas no próprio
  # commit que vira versão.
  quality:
    name: Metas do SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conferir as metas na main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          revision=''
          if [ "${ON_MAIN}" = 'true' ]; then revision="${GITHUB_SHA}"; fi
          bash tools/sonar/check-quality-gate.sh main "${revision}"

  release:
    name: Release
    needs: [format, checks, e2e, quality]
    # WHY: release de verdade só a partir da main; o dry-run vale em qualquer
    # branch porque não altera nada.
    if: ${{ inputs.dry-run || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOTE: `contents` para commit, tags e Releases; `packages` para o GitHub
    # Packages e o GHCR. Sem `id-token`: lá não há proveniência do npm.
    permissions:
      contents: write
      packages: write
    steps:
      # WHY: o `nx release` precisa da história inteira e das tags para achar a
      # versão atual de cada projeto. O push do commit de versão e das tags vai
      # pela deploy key, a única exceção do ruleset da main (ADR 0015).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # NOTE: `registry-url` e `scope` fazem o setup-node gerar o .npmrc com
      # `NODE_AUTH_TOKEN` para o GitHub Packages.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          go-version-file: apps/services/example-go/go.mod
          java-version: '21'
          registry-url: https://npm.pkg.github.com
          scope: '@mateusmacedo'

      - name: Login no GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar autor do commit de release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # WHY: com 0 projetos publicáveis o `nx release` falha DEPOIS de criar
      # tags e Releases (não acha o alvo `nx-release-publish`); aí só versiona.
      # Conta só libs npm não privadas e imagens dos grupos de release (as
      # tags `publishable` e `release:image`), não qualquer projeto com Dockerfile.
      - name: Contar projetos publicáveis
        id: publishable
        run: |
          count="$(pnpm exec nx show projects --withTarget=nx-release-publish -p 'tag:publishable,tag:release:image' --json | jq 'length')"
          echo "projetos publicáveis: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # WHY: no dry-run o `nx release` não roda o preVersionCommand que constrói
      # as imagens e o `docker tag` falha sem a imagem local. No release de
      # verdade o próprio Nx constrói antes de versionar.
      - name: Construir imagens (dry-run)
        if: ${{ inputs.dry-run }}
        run: |
          count="$(pnpm exec nx show projects --withTarget=docker:build --json | jq 'length')"
          if [ "${count}" -gt 0 ]; then
            pnpm exec nx run-many -t docker:build
          else
            echo "nenhum projeto com Dockerfile"
          fi

      # NOTE: `--yes` e `--skip-publish` são exclusivos; sem tag, o Nx usa a
      # versão em disco (fallback `disk`). `LEFTHOOK=0`: o bot dispensa os hooks.
      # WHY: a `version` vem por variável de ambiente, e não interpolada no
      # script, para o texto digitado no disparo não virar comando.
      - name: Nx Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEFTHOOK: '0'
          DRY_RUN: ${{ inputs.dry-run }}
          VERSION: ${{ inputs.version }}
          PUBLISHABLE: ${{ steps.publishable.outputs.count }}
        run: |
          args=()
          if [ -n "${VERSION}" ]; then
            semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
            keyword='^(major|minor|patch|premajor|preminor|prepatch|prerelease)$'
            if [[ ! "${VERSION}" =~ ${semver} && ! "${VERSION}" =~ ${keyword} ]]; then
              echo '::error::version inválida. Use semver (1.0.0-rc.1) ou um especificador do Nx (patch, minor, major, prerelease).'
              exit 1
            fi
            args+=("${VERSION}")
          fi
          if [ "${DRY_RUN}" = 'true' ]; then args+=(--dry-run); fi
          if [ "${PUBLISHABLE}" = '0' ]; then args+=(--skip-publish); else args+=(--yes); fi
          pnpm exec nx release "${args[@]}"
