// WHY: o lock vale também para os plugins do build (classpath do buildscript),
// gravado no buildscript-gradle.lockfile da raiz.
buildscript {
  configurations.classpath {
    resolutionStrategy.activateDependencyLocking()
  }
}

plugins {
  id 'io.quarkus' apply false
  // WHY: relata projetos, dependências e tasks do Gradle ao @nx/gradle, que
  // monta o grafo e os targets do Nx.
  id 'dev.nx.gradle.project-graph' version '0.1.26'
  id 'com.diffplug.spotless' version '8.11.0' apply false
}

allprojects {
  apply plugin: 'dev.nx.gradle.project-graph'

  // WHY: o lock deixa as versões resolvidas previsíveis e revisáveis no PR, na
  // raiz e em cada projeto; regenere com
  // `./gradlew resolveAndLockAll --write-locks`.
  dependencyLocking {
    lockAllConfigurations()
  }

  tasks.register('resolveAndLockAll') {
    description = 'Resolve todas as configurações para gravar o gradle.lockfile.'
    notCompatibleWithConfigurationCache('resolve configurações em execução')
    doFirst {
      if (!gradle.startParameter.writeDependencyLocks) {
        throw new GradleException('Rode com --write-locks.')
      }
    }
    doLast {
      configurations.findAll { it.canBeResolved }.each { it.resolve() }
    }
  }
}

subprojects {
  apply plugin: 'java-library'
  apply plugin: 'com.diffplug.spotless'

  group = 'dev.playground'
  version = '0.1.0-SNAPSHOT'

  repositories {
    mavenCentral()
  }

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(21)
    }
  }

  spotless {
    java {
      target 'src/**/*.java'
      // NOTE: versão do Eclipse fixada para o formato não mudar quando o
      // Spotless trocar o padrão; o perfil serve também ao editor.
      eclipse('4.41').configFile(
          rootProject.file('tools/java/eclipse-formatter.xml'))
    }
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
  }

  dependencies {
    testImplementation enforcedPlatform(
        "${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  }

  tasks.withType(Test).configureEach {
    useJUnitPlatform()
  }

  // WHY: cobertura só com -Pcoverage, usada pela análise do SonarQube (ADR
  // 0013). O JaCoCo e o quarkus-jacoco entram sempre, desligados sem a flag,
  // para o grafo de dependências e o lock serem os mesmos nos dois modos.
  def coverage = providers.gradleProperty('coverage').present
  apply plugin: 'jacoco'
  tasks.named('test') {
    jacoco {
      enabled = coverage
      // WHY: sem o filtro, o agente instrumenta também o Quarkus e as
      // dependências.
      includes = ['dev.playground.*']
    }
    if (coverage) {
      finalizedBy 'jacocoTestReport', 'jacocoTestCoverageVerification'
    }
  }
  tasks.named('jacocoTestReport') {
    reports { xml.required = true }
  }
  // WHY: a meta do projeto é cobertura acima de 90% em linhas e ramos; 0,9001
  // é o menor valor que o JaCoCo aceita como "acima de 0,9".
  tasks.named('jacocoTestCoverageVerification') {
    mustRunAfter 'jacocoTestReport'
    violationRules {
      rule {
        limit {
          counter = 'LINE'
          minimum = 0.9001
        }
        limit {
          counter = 'BRANCH'
          minimum = 0.9001
        }
      }
    }
  }
  plugins.withId('io.quarkus') {
    // WHY: o @QuarkusTest carrega as classes no QuarkusClassLoader, que o
    // agente do JaCoCo não mede; o quarkus-jacoco mede essas classes e grava no
    // mesmo arquivo de dados que o jacocoTestReport lê.
    dependencies { testImplementation 'io.quarkus:quarkus-jacoco' }
    tasks.named('test') {
      systemProperty 'quarkus.jacoco.enabled', coverage.toString()
      systemProperty 'quarkus.jacoco.report', 'false'
      jacoco {
        excludeClassLoaders = ['*QuarkusClassLoader']
        destinationFile = layout.buildDirectory
            .file('jacoco-quarkus.exec').get().asFile
      }
      if (coverage) {
        // WHY: os 512 MB padrão da JVM de teste não comportam o build da
        // aplicação de teste com o quarkus-jacoco ligado.
        maxHeapSize = '1g'
      }
    }
  }
}
