quarkusPluginVersion=3.40.1.2
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.40.1.2

# WHY: a máquina de desenvolvimento divide a RAM com o Floci, o Next.js e o
# build nativo; dois workers e 1,5 GiB de heap bastam para os projetos Java.
org.gradle.workers.max=2
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
# WHY: o gradlew e cada servidor de linguagem Java do editor sobem o próprio
# daemon; com o padrão de 3 h ocioso, eles se acumulam e esgotam a memória.
org.gradle.daemon.idletimeout=900000
