service: example-quarkus

frameworkVersion: '4'

# WHY: o núcleo do Serverless v4 fala com CloudFormation e S3 pelo AWS SDK v2,
# que ignora AWS_ENDPOINT_URL; o plugin redireciona essas chamadas ao Floci.
plugins:
  - serverless-localstack

# WHY: no Floci o zip é o build JVM, rápido e leve para o ciclo de dev; nos
# stages da AWS é o executável nativo, com cold start curto.
params:
  default:
    lambdaRuntime: provided.al2023
  local:
    lambdaRuntime: java21

custom:
  localstack:
    stages:
      - local
    host: http://localhost
    edgePort: 4566
    autostart: false
  # WHY: sem retenção o grupo de logs da função nunca expira e o custo de
  # armazenamento só cresce; prod guarda mais para investigação.
  logRetentionInDays:
    prod: 30
  nxServerless:
    language: java
    type: http
    gradleProject: example-quarkus

provider:
  name: aws
  stage: ${opt:stage, 'local'}
  region: ${env:AWS_REGION, 'us-east-1'}
  runtime: ${param:lambdaRuntime}
  # WHY: o native-image não faz cross-compile; o executável tem a arquitetura
  # da máquina do build, x86_64 nos runners e nas máquinas de hoje.
  architecture: ${env:SLS_ARCH, 'x86_64'}
  memorySize: 256
  timeout: 29
  logRetentionInDays: ${self:custom.logRetentionInDays.${sls:stage}, 7}
  environment:
    LOG_LEVEL: ${ssm:/playground/${sls:stage}/${aws:region}/example-quarkus/config/log-level, 'info'}

package:
  individually: true

functions:
  handler:
    # NOTE: o runtime provided.al2023 ignora o handler e executa o bootstrap.
    handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
    package:
      artifact: build/function.zip
    events:
      - httpApi:
          path: /example-quarkus
          method: get
