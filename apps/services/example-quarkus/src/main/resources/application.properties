quarkus.application.name=example-quarkus

# Modo container: mesma porta e o mesmo health dos outros serviços.
quarkus.http.port=${PORT:8080}
quarkus.smallrye-health.root-path=/health
# WHY: no SIGTERM do orquestrador, espera as requisições em andamento.
quarkus.shutdown.timeout=10s

# O serverless.yml resolve LOG_LEVEL do SSM.
quarkus.log.level=${LOG_LEVEL:INFO}
# WHY: formato mínimo comum com TypeScript e Go (`time`, `level`, `message`). O
# Quarkus só renomeia a chave: o valor do nível sai em maiúsculas e o id da
# invocação da Lambda fica em `mdc.AWSRequestId`, e não em `requestId`.
quarkus.log.console.json.key-overrides=timestamp=time
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Build nativo (só com -Dquarkus.native.enabled=true): Mandrel em container,
# com executável Linux compatível com o provided.al2023.
quarkus.native.container-build=true
# WHY: sem teto, o native-image se dimensiona pela RAM da máquina e disputa a
# memória com o Floci e o editor; o limite do container cobre heap e o resto.
quarkus.native.native-image-xmx=2g
quarkus.native.container-runtime-options=--memory=3g
